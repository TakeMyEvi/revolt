<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>REVOLT</title>
  <!-- "Add to Home Screen" installability — only matters when this page is
       navigated to directly, not when embedded in an iframe (e.g. itch.io's
       game page wraps it that way; the raw build URL / a direct host doesn't). -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="theme-color" content="#05050f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="REVOLT" />
  <!-- Poki ad SDK — required for Poki hosting; on any other host (itch.io,
       local dev) this request just fails silently and src/systems/poki.js's
       window.PokiSDK guards make every call a no-op, so nothing else breaks. -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #05050f;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    #game-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    /* REVOLT is a fixed landscape (900x550) game. On a phone held upright,
       Phaser.Scale.FIT would otherwise shrink the whole game — buttons and
       all — down to a tiny strip in the middle of a mostly-black screen.
       Rather than force the player to physically rotate their phone, rotate
       the container itself: swapping width/height first means Phaser's
       Scale Manager (which reads the container's un-rotated layout box)
       sees a landscape-shaped box and fills it properly. */
    @media screen and (max-width: 900px) and (orientation: portrait) {
      #game-container {
        width: 100vh;
        height: 100vw;
        top: 50%;
        left: 50%;
        transform-origin: center center;
        transform: translate(-50%, -50%) rotate(90deg);
      }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
